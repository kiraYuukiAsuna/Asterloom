name: asterloom

services:
  migrations:
    image: asterloom-server:local
    entrypoint: ["dotnet", "/app/migrations/Asterloom.Migrations.dll"]
    command: ["--Persistence:Provider=PostgreSql"]
    environment:
      ConnectionStrings__Asterloom: Host=postgres;Port=5432;Database=asterloom;Username=asterloom;Password=${POSTGRES_PASSWORD:-asterloom-dev};GSS Encryption Mode=Disable
      Identity__Bootstrap__AdminDisplayName: ${ASTERLOOM_BOOTSTRAP_ADMIN_NAME:-Local Administrator}
      Identity__Bootstrap__AdminEmail: ${ASTERLOOM_BOOTSTRAP_ADMIN_EMAIL:-admin@asterloom.local}
      Identity__Bootstrap__AdminPassword: ${ASTERLOOM_BOOTSTRAP_ADMIN_PASSWORD:-Asterloom-Local-Admin!2026}
      Identity__WebClient__ClientId: asterloom-web
      Identity__WebClient__ClientSecret: ${ASTERLOOM_OIDC_CLIENT_SECRET:-Asterloom-Web-Local-Secret!2026}
      Identity__WebClient__RedirectUri: http://localhost:60000/api/auth/callback
      Identity__WebClient__PostLogoutRedirectUri: http://localhost:60000/api/auth/logout/callback
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: asterloom-server:local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Persistence__Provider: PostgreSql
      ConnectionStrings__Asterloom: Host=postgres;Port=5432;Database=asterloom;Username=asterloom;Password=${POSTGRES_PASSWORD:-asterloom-dev};GSS Encryption Mode=Disable
      Identity__Issuer: http://localhost:60001/
      Identity__WebClient__ClientId: asterloom-web
      Identity__DataProtectionKeysPath: /var/lib/asterloom/dataprotection-keys
      Storage__Endpoint: http://minio:9000
      Storage__PublicEndpoint: http://localhost:60003
      Storage__PhysicalBucket: asterloom-objects
      Storage__AccessKey: ${MINIO_ROOT_USER:-asterloom}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD:-asterloom-dev-secret}
      Storage__ForcePathStyle: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Telemetry__Enabled: "false"
      Telemetry__CollectorHealthEndpoint: http://otel-collector:13133/
      Telemetry__IngestionApiKey: ${TELEMETRY_INGESTION_API_KEY:-asterloom-telemetry-dev}
    depends_on:
      migrations:
        condition: service_completed_successfully
      minio:
        condition: service_started
      otel-collector:
        condition: service_started
    ports:
      - "60001:8000"
      - "60002:8001"
    volumes:
      - ./.data/dataprotection-keys:/var/lib/asterloom/dataprotection-keys
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    image: asterloom-web:local
    environment:
      ASTERLOOM_BACKEND_URL: http://server:8000
      ASTERLOOM_PASSPORT_PUBLIC_URL: http://localhost:60001
      ASTERLOOM_WEB_ORIGIN: http://localhost:60000
      ASTERLOOM_OIDC_ISSUER: http://localhost:60001
      ASTERLOOM_OIDC_CLIENT_ID: asterloom-web
      ASTERLOOM_OIDC_CLIENT_SECRET: ${ASTERLOOM_OIDC_CLIENT_SECRET:-Asterloom-Web-Local-Secret!2026}
      ASTERLOOM_SESSION_STORE: redis
      ASTERLOOM_SESSION_REDIS_URL: redis://redis:6379/0
      ASTERLOOM_SESSION_REDIS_PASSWORD: ${REDIS_PASSWORD:-asterloom-redis-dev}
      ASTERLOOM_SESSION_ENCRYPTION_KEY: ${ASTERLOOM_SESSION_ENCRYPTION_KEY:-fP0onfOHksI6iuEJADvkZGIWobkecx4whP0vDIp73GE=}
      ASTERLOOM_ALLOW_INSECURE_DEVELOPMENT: "true"
    depends_on:
      redis:
        condition: service_healthy
      server:
        condition: service_started
    ports:
      - "60000:3000"
    restart: unless-stopped

  reference-backend:
    build:
      context: .
      dockerfile: Dockerfile.reference
      target: backend
    image: asterloom-reference-backend:local
    env_file:
      - path: ./.data/reference-app/reference.env
        required: false
    environment:
      ConnectionStrings__ReferenceApp: Host=postgres;Port=5432;Database=asterloom;Username=asterloom;Password=${POSTGRES_PASSWORD:-asterloom-dev};GSS Encryption Mode=Disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      Asterloom__TenantId: ${ASTERLOOM_REFERENCE_TENANT_ID:-}
      Asterloom__ApplicationId: ${ASTERLOOM_REFERENCE_APPLICATION_ID:-}
      Asterloom__EnvironmentId: ${ASTERLOOM_REFERENCE_ENVIRONMENT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    ports:
      - "60004:5090"
      - "60005:5091"
    restart: unless-stopped

  reference-client:
    profiles: ["reference"]
    build:
      context: .
      dockerfile: Dockerfile.reference
      target: client
    image: asterloom-reference-client:local
    environment:
      ASTERLOOM_BASE_URL: ${ASTERLOOM_BASE_URL:-http://host.docker.internal:60001/}
      ASTERLOOM_ISSUER: ${ASTERLOOM_ISSUER:-http://host.docker.internal:60001/}
      ASTERLOOM_REFERENCE_BACKEND_URL: http://reference-backend:5090/
      ASTERLOOM_REFERENCE_BACKEND_GRPC_URL: http://reference-backend:5091/
      ASTERLOOM_ALLOW_INSECURE_DEVELOPMENT: "true"
      ASTERLOOM_REFERENCE_OTEL_METRICS_URL: http://otel-collector:8888/metrics
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:14317
      OTEL_BSP_SCHEDULE_DELAY: "250"
      OTEL_BLRP_SCHEDULE_DELAY: "250"
      OTEL_METRIC_EXPORT_INTERVAL: "500"
    depends_on:
      reference-backend:
        condition: service_started
      server:
        condition: service_started
    volumes:
      - ./.data/reference-app/state:/var/lib/asterloom-reference
    restart: "no"

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: asterloom
      POSTGRES_USER: asterloom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asterloom-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asterloom -d asterloom"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:8.10.0-alpine
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-asterloom-redis-dev}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./.data/redis:/data
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-asterloom}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-asterloom-dev-secret}
    ports:
      - "60003:9000"
    volumes:
      - ./.data/minio:/data
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      TELEMETRY_INGESTION_API_KEY: ${TELEMETRY_INGESTION_API_KEY:-asterloom-telemetry-dev}
    volumes:
      - ./Deploy/OpenTelemetry/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped
