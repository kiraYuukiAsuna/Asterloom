    category: runtime
    http: POST /api/v1/identity/accounts:confirm-email
    sdkTest: Backend/Tests/Asterloom.ContractTests/IdentityAdminContractTests.cs
    notApplicableReason: Email confirmation belongs to each business application's user journey; the Web Console manages accounts but does not impersonate a business client.
