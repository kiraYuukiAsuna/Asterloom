version: v2
modules:
  - path: Proto
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  except:
    # The repository intentionally keeps contracts under Proto/Asterloom while
    # packages separate runtime and admin services with an extra package segment.
    - PACKAGE_DIRECTORY_MATCH
  rpc_allow_google_protobuf_empty_requests: true
breaking:
  use:
    - FILE
