syntax = "proto3";

package asterloom.release.v1;

import "Asterloom/storage/v1/storage_types.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Asterloom.Protocol.Release.V1";

enum ReleaseSigningKeyStatus {
  RELEASE_SIGNING_KEY_STATUS_UNSPECIFIED = 0;
  RELEASE_SIGNING_KEY_STATUS_ACTIVE = 1;
  RELEASE_SIGNING_KEY_STATUS_ARCHIVED = 2;
}

enum ReleaseArtifactStatus {
  RELEASE_ARTIFACT_STATUS_UNSPECIFIED = 0;
  RELEASE_ARTIFACT_STATUS_UPLOADING = 1;
  RELEASE_ARTIFACT_STATUS_VERIFIED = 2;
  RELEASE_ARTIFACT_STATUS_REJECTED = 3;
  RELEASE_ARTIFACT_STATUS_ARCHIVED = 4;
}

enum ReleaseArtifactKind {
  RELEASE_ARTIFACT_KIND_UNSPECIFIED = 0;
  RELEASE_ARTIFACT_KIND_FULL = 1;
  RELEASE_ARTIFACT_KIND_DELTA = 2;
}

enum ReleaseChannelStatus {
  RELEASE_CHANNEL_STATUS_UNSPECIFIED = 0;
  RELEASE_CHANNEL_STATUS_ACTIVE = 1;
  RELEASE_CHANNEL_STATUS_ARCHIVED = 2;
}

enum DesktopReleaseStatus {
  DESKTOP_RELEASE_STATUS_UNSPECIFIED = 0;
  DESKTOP_RELEASE_STATUS_DRAFT = 1;
  DESKTOP_RELEASE_STATUS_PUBLISHED = 2;
  DESKTOP_RELEASE_STATUS_PAUSED = 3;
  DESKTOP_RELEASE_STATUS_ROLLED_BACK = 4;
}

enum ReleaseValidationSeverity {
  RELEASE_VALIDATION_SEVERITY_UNSPECIFIED = 0;
  RELEASE_VALIDATION_SEVERITY_ERROR = 1;
  RELEASE_VALIDATION_SEVERITY_WARNING = 2;
}

enum UpdateDecisionReason {
  UPDATE_DECISION_REASON_UNSPECIFIED = 0;
  UPDATE_DECISION_REASON_UPDATE_AVAILABLE = 1;
  UPDATE_DECISION_REASON_CURRENT = 2;
  UPDATE_DECISION_REASON_CHANNEL_EMPTY = 3;
  UPDATE_DECISION_REASON_RELEASE_PAUSED = 4;
  UPDATE_DECISION_REASON_TARGETING_MISS = 5;
  UPDATE_DECISION_REASON_ROLLOUT_EXCLUDED = 6;
  UPDATE_DECISION_REASON_NO_COMPATIBLE_ARTIFACT = 7;
}

message ReleaseSigningKey {
  string id = 1;
  string tenant_id = 2;
  string key = 3;
  string display_name = 4;
  string algorithm = 5;
  string fingerprint = 6;
  string public_key_pem = 7;
  ReleaseSigningKeyStatus status = 8;
  int64 version = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  google.protobuf.Timestamp archived_at = 12;
}

message ReleaseChannel {
  string id = 1;
  string tenant_id = 2;
  string application_id = 3;
  string environment_id = 4;
  string key = 5;
  string display_name = 6;
  string description = 7;
  ReleaseChannelStatus status = 8;
  string active_release_id = 9;
  string previous_release_id = 10;
  int64 version = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp archived_at = 14;
}

message ReleaseArtifact {
  string id = 1;
  string tenant_id = 2;
  string application_id = 3;
  string environment_id = 4;
  string release_version = 5;
  string target_runtime_id = 6;
  ReleaseArtifactKind artifact_kind = 7;
  string delta_from_version = 8;
  string file_name = 9;
  string content_type = 10;
  int64 size_bytes = 11;
  string sha256 = 12;
  string signing_key_id = 13;
  string signature = 14;
  ReleaseArtifactStatus status = 15;
  string failure_reason = 16;
  string storage_bucket_id = 17;
  string storage_object_id = 18;
  string upload_session_id = 19;
  int64 storage_object_version = 20;
  int64 version = 21;
  google.protobuf.Timestamp created_at = 22;
  google.protobuf.Timestamp updated_at = 23;
  google.protobuf.Timestamp verified_at = 24;
  google.protobuf.Timestamp archived_at = 25;
}

message ArtifactUpload {
  ReleaseArtifact artifact = 1;
  asterloom.storage.v1.StorageUploadSession upload_session = 2;
}

message DesktopRelease {
  string id = 1;
  string tenant_id = 2;
  string application_id = 3;
  string environment_id = 4;
  string channel_id = 5;
  string release_version = 6;
  string display_name = 7;
  string release_notes = 8;
  repeated string artifact_ids = 9;
  uint32 rollout_basis_points = 10;
  string target_segment_id = 11;
  bool mandatory = 12;
  string minimum_version = 13;
  string bucketing_salt = 14;
  DesktopReleaseStatus status = 15;
  int64 revision = 16;
  string manifest_payload_json = 17;
  string manifest_sha256 = 18;
  string manifest_signature = 19;
  string manifest_signing_key_id = 20;
  string manifest_signing_key_fingerprint = 21;
  int64 version = 22;
  google.protobuf.Timestamp created_at = 23;
  google.protobuf.Timestamp updated_at = 24;
  google.protobuf.Timestamp published_at = 25;
  google.protobuf.Timestamp paused_at = 26;
  google.protobuf.Timestamp rolled_back_at = 27;
  google.protobuf.Timestamp manifest_generated_at = 28;
}

message ReleaseManifestArtifact {
  string artifact_id = 1;
  string target_runtime_id = 2;
  ReleaseArtifactKind artifact_kind = 3;
  string delta_from_version = 4;
  string file_name = 5;
  string content_type = 6;
  int64 size_bytes = 7;
  string sha256 = 8;
  string signature = 9;
  string signing_key_id = 10;
  string signing_key_fingerprint = 11;
}

message ReleaseManifest {
  string release_id = 1;
  string channel_key = 2;
  string release_version = 3;
  string display_name = 4;
  string release_notes = 5;
  bool mandatory = 6;
  string minimum_version = 7;
  int64 revision = 8;
  repeated ReleaseManifestArtifact artifacts = 9;
  string payload_json = 10;
  string sha256 = 11;
  string signature = 12;
  string signing_key_id = 13;
  string signing_key_fingerprint = 14;
  google.protobuf.Timestamp generated_at = 15;
}

message ReleaseValidationIssue {
  ReleaseValidationSeverity severity = 1;
  string code = 2;
  string path = 3;
  string message = 4;
}

message ReleaseValidationResult {
  bool valid = 1;
  repeated ReleaseValidationIssue issues = 2;
  ReleaseManifest candidate_manifest = 3;
}

// A release artifact paired with the short-lived download ticket that grants
// access to it. Update decisions can expose more than one asset so clients can
// attempt a delta package while retaining the target full package as fallback.
message ReleaseArtifactDownload {
  ReleaseArtifact artifact = 1;
  asterloom.storage.v1.StorageTransferTicket download = 2;
}

message UpdateDecision {
  bool update_available = 1;
  UpdateDecisionReason reason = 2;
  ReleaseChannel channel = 3;
  DesktopRelease release = 4;
  ReleaseManifest manifest = 5;
  ReleaseArtifact selected_artifact = 6;
  asterloom.storage.v1.StorageTransferTicket download = 7;
  bool mandatory = 8;
  bool bucket_evaluated = 9;
  uint32 bucket = 10;
  uint32 rollout_basis_points = 11;
  repeated string trace = 12;
  repeated ReleaseArtifactDownload artifact_downloads = 13;
}
