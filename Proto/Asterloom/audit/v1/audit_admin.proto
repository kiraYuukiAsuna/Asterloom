syntax = "proto3";

package asterloom.audit.admin.v1;

import "Asterloom/audit/v1/audit_types.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Asterloom.Protocol.Audit.Admin.V1";

service AuditAdminService {
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse) {
    option (google.api.http) = {get: "/api/v1/audit/events"};
  }
  rpc GetAuditEvent(GetAuditEventRequest) returns (asterloom.audit.v1.AuditEvent) {
    option (google.api.http) = {get: "/api/v1/audit/events/{audit_event_id}"};
  }
  rpc ExportAuditEvents(ExportAuditEventsRequest) returns (ExportAuditEventsResponse) {
    option (google.api.http) = {
      post: "/api/v1/audit/events:export"
      body: "*"
    };
  }
}

message ListAuditEventsRequest {
  int32 page_size = 1;
  string page_token = 2;
  string actor_id = 3;
  string operation = 4;
  asterloom.audit.v1.AuditOutcome outcome = 5;
  string request_id = 6;
  google.protobuf.Timestamp from_at = 7;
  google.protobuf.Timestamp to_at = 8;
}

message ListAuditEventsResponse {
  repeated asterloom.audit.v1.AuditEvent audit_events = 1;
  string next_page_token = 2;
}

message GetAuditEventRequest {
  string audit_event_id = 1;
}

message ExportAuditEventsRequest {
  string actor_id = 1;
  string operation = 2;
  asterloom.audit.v1.AuditOutcome outcome = 3;
  string request_id = 4;
  google.protobuf.Timestamp from_at = 5;
  google.protobuf.Timestamp to_at = 6;
  int32 maximum_rows = 7;
}

message ExportAuditEventsResponse {
  string file_name = 1;
  string content_type = 2;
  bytes content = 3;
  int32 exported_rows = 4;
}
