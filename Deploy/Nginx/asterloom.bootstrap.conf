server {
    listen 80;
    listen [::]:80;
    server_name asterloom.kirayuukiasuna.cloud;

    access_log /var/log/nginx/asterloom.access.log;
    error_log /var/log/nginx/asterloom.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 503 "Asterloom is starting; HTTPS will be enabled after certificate issuance.\n";
        add_header Content-Type text/plain;
    }
}
