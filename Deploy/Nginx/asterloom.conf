server {
    listen 80;
    listen [::]:80;
    server_name asterloom.kirayuukiasuna.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name asterloom.kirayuukiasuna.cloud;

    ssl_certificate /etc/letsencrypt/live/asterloom.kirayuukiasuna.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asterloom.kirayuukiasuna.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/asterloom.access.log;
    error_log /var/log/nginx/asterloom.error.log;

    client_max_body_size 2g;
    client_body_timeout 30m;
    keepalive_timeout 75s;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    location ~ ^/asterloom\.reference\.v1\.ReferenceAppService/[A-Za-z0-9_]+$ {
        grpc_pass grpc://127.0.0.1:15083;
        grpc_set_header Host $host;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto https;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }

    location ~ ^/asterloom\.[A-Za-z0-9_.]+/[A-Za-z0-9_]+$ {
        grpc_pass grpc://127.0.0.1:15084;
        grpc_set_header Host $host;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto https;
        grpc_read_timeout 300s;
        grpc_send_timeout 300s;
    }

    location ^~ /asterloom-objects/ {
        proxy_pass http://127.0.0.1:19000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
    }

    location ^~ /.well-known/ {
        proxy_pass http://127.0.0.1:15080;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /connect/ {
        proxy_pass http://127.0.0.1:15080;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /passport/ {
        proxy_pass http://127.0.0.1:15080;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:15080;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 30m;
        proxy_send_timeout 30m;
    }

    location ^~ /api/reference/ {
        proxy_pass http://127.0.0.1:15082;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /health/ {
        proxy_pass http://127.0.0.1:15080;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://127.0.0.1:15081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
