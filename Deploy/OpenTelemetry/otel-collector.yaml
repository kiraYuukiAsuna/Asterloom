extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  otlp/reference:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14317

processors:
  batch:
    timeout: 1s
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

exporters:
  otlp_http/database:
    endpoint: http://server:8000/api/v1/telemetry/otlp
    encoding: json
    compression: none
    headers:
      X-Asterloom-Telemetry-Key: ${env:TELEMETRY_INGESTION_API_KEY}
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions:
    - health_check
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/database]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/database]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/database]
    traces/reference:
      receivers: [otlp/reference]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/database]
    metrics/reference:
      receivers: [otlp/reference]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/database]
    logs/reference:
      receivers: [otlp/reference]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/database]
